<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voter – Quiz de la mariée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#2B1B3D; --panel:#46295f; --cream:#FFF4E6;
  --raspberry:#FF5D8F; --tangerine:#FF9F45; --pistachio:#7BD389; --lemon:#FFD93D;
  --shadow:0 12px 36px rgba(0,0,0,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--cream);min-height:100dvh;
  background:radial-gradient(900px 600px at 20% 10%,rgba(255,93,143,.22),transparent 55%),
    radial-gradient(800px 600px at 85% 90%,rgba(123,211,137,.18),transparent 55%),var(--plum);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:1.5rem 1rem 2rem;gap:1.2rem;-webkit-font-smoothing:antialiased}

/* header */
.header{text-align:center}
.header .kicker{font-family:'Fredoka',sans-serif;font-size:.85rem;font-weight:500;
  text-transform:uppercase;letter-spacing:.25em;color:var(--tangerine);margin:0 0 .2rem}
.header h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.4rem,7vw,2.2rem);
  margin:0;line-height:1.1}

/* écran nom */
#screen-name{width:100%;max-width:420px;display:flex;flex-direction:column;gap:1rem;align-items:center}
#screen-name p{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(1rem,5vw,1.3rem);
  text-align:center;margin:0;opacity:.85}
#name-input{width:100%;padding:.9rem 1.2rem;border-radius:16px;border:2px solid rgba(255,244,230,.25);
  background:rgba(255,244,230,.08);color:var(--cream);font-family:'Fredoka',sans-serif;
  font-weight:600;font-size:clamp(1.1rem,5vw,1.4rem);outline:none;text-align:center;
  transition:border-color .2s}
#name-input::placeholder{color:rgba(255,244,230,.35)}
#name-input:focus{border-color:var(--tangerine)}
.btn-primary{border:0;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:700;
  font-size:clamp(1rem,5vw,1.3rem);color:var(--plum);padding:.85rem 2rem;border-radius:999px;
  background:linear-gradient(120deg,var(--lemon),var(--tangerine));box-shadow:var(--shadow);
  transition:transform .15s,opacity .2s;width:100%;max-width:320px}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}

/* écran vote */
#screen-vote{width:100%;max-width:480px;display:none;flex-direction:column;gap:1rem;align-items:center}
#screen-vote.show{display:flex}
#screen-name.hide{display:none}

.q-label{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1rem,5vw,1.35rem);
  text-align:center;line-height:1.3;max-width:32ch;margin:0}

.opt-btn{width:100%;display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;
  border-radius:18px;border:2px solid rgba(255,244,230,.12);background:var(--panel);
  color:var(--cream);cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;
  font-size:clamp(.95rem,4.5vw,1.15rem);text-align:left;box-shadow:var(--shadow);
  transition:border-color .2s,transform .15s,opacity .2s;-webkit-appearance:none}
.opt-btn:active{transform:scale(.98)}
.opt-btn.selected{border-color:var(--lemon);background:rgba(255,217,61,.12)}
.opt-btn.disabled{opacity:.45;pointer-events:none}
.opt-btn .badge{flex:none;width:2.4rem;height:2.4rem;border-radius:12px;display:grid;place-items:center;
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:1.3rem;color:var(--plum)}
.opt-btn:nth-child(1) .badge{background:var(--raspberry)}
.opt-btn:nth-child(2) .badge{background:var(--tangerine)}
.opt-btn:nth-child(3) .badge{background:var(--pistachio)}
.opt-btn:nth-child(4) .badge{background:var(--lemon)}
.opt-btn:nth-child(5) .badge{background:var(--raspberry)}

/* état en attente */
#screen-wait{display:none;flex-direction:column;align-items:center;gap:1rem;text-align:center;
  font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(1rem,5vw,1.3rem)}
#screen-wait.show{display:flex}
.pulse{font-size:3rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* confirmé */
#screen-done{display:none;flex-direction:column;align-items:center;gap:.7rem;text-align:center}
#screen-done.show{display:flex}
.big-check{font-size:4rem;animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.done-msg{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(1.1rem,5vw,1.5rem)}
.done-sub{font-family:'Fredoka',sans-serif;font-weight:500;font-size:clamp(.85rem,4vw,1.05rem);opacity:.7}

/* personnage */
#emma-vote{
  display:block;
  height:clamp(140px,28vh,240px);
  width:auto;
  filter:drop-shadow(0 12px 28px rgba(255,93,143,.20));
  margin:0 auto -.5rem;
}
</style>
</head>
<body>

<img id="emma-vote" src="emma.png" alt="Emmanuelle" aria-hidden="true">
<div class="header">
  <p class="kicker">Quiz de la mariée</p>
  <h1>Emmanuelle 💛</h1>
</div>

<!-- Écran 1 : saisie du prénom -->
<div id="screen-name">
  <p>Comment tu t'appelles ?</p>
  <input id="name-input" type="text" placeholder="Ton prénom" maxlength="30" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="btn-primary" id="name-btn" disabled>C'est parti !</button>
</div>

<!-- Écran 2a : en attente de la prochaine question -->
<div id="screen-wait">
  <div class="pulse">⏳</div>
  <p>En attente de la prochaine question...</p>
</div>

<!-- Écran 2b : vote en cours -->
<div id="screen-vote">
  <p id="q-label" class="q-label"></p>
  <p id="multi-hint" style="font-family:'Fredoka',sans-serif;font-size:.95rem;opacity:.6;margin:-.2rem 0 .4rem;display:none;">Tu peux choisir plusieurs réponses</p>
  <div id="opt-list"></div>
  <button id="valider-btn" class="btn-primary" style="margin-top:1rem;display:none;" disabled>Valider mon vote</button>
</div>

<!-- Écran 3 : vote enregistré -->
<div id="screen-done">
  <div class="big-check">✅</div>
  <p class="done-msg">Vote enregistré !</p>
  <p class="done-sub" id="done-sub">En attente de la prochaine question...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnpff-qO2oz_61-7yvKXLGAcg89oM9wGE",
  authDomain: "quiz-mariage-4eac8.firebaseapp.com",
  databaseURL: "https://quiz-mariage-4eac8-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "quiz-mariage-4eac8",
  storageBucket: "quiz-mariage-4eac8.firebasestorage.app",
  messagingSenderId: "376344283690",
  appId: "1:376344283690:web:531a87c67d4f048747d153"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const LETTERS = ['A','B','C','D','E','F'];
let voterName        = '';
let currentQuestion  = -1;   // qIdx de la question actuellement affichée
let voteIsOpen       = false; // état local du vote
let hasVoted         = false; // a-t-on déjà validé pour cette question
let selected         = new Set();
let currentOptions   = [];

const nameInput  = document.getElementById('name-input');
const nameBtn    = document.getElementById('name-btn');
const screenName = document.getElementById('screen-name');
const screenWait = document.getElementById('screen-wait');
const screenVote = document.getElementById('screen-vote');
const screenDone = document.getElementById('screen-done');
const qLabel     = document.getElementById('q-label');
const optList    = document.getElementById('opt-list');
const doneSub    = document.getElementById('done-sub');
const multiHint  = document.getElementById('multi-hint');

nameInput.addEventListener('input', () => {
  nameBtn.disabled = nameInput.value.trim().length < 2;
});
nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !nameBtn.disabled) confirmName();
});
nameBtn.addEventListener('click', confirmName);

function confirmName() {
  voterName = nameInput.value.trim();
  if (voterName.length < 2) return;
  screenName.classList.add('hide');
  listenState();
}

// ── Firebase listener ────────────────────────────────────────────────────────
function listenState() {
  onValue(ref(db, 'state'), snap => {
    if (!snap.exists()) { show('wait'); return; }
    const s      = snap.val();
    const qIdx   = s.currentQuestion ?? -1;
    const isOpen = s.voteOpen === true;
    const opts   = s.options || [];

    // Nouvelle question → reset complet (toujours, même si vote pas encore ouvert)
    if (qIdx !== currentQuestion) {
      currentQuestion = qIdx;
      hasVoted        = false;
      selected        = new Set();
      voteIsOpen      = false;
    }

    // Cas 1 : vote ouvert et pas encore voté → afficher l'UI de vote
    if (isOpen && !hasVoted && opts.length > 0) {
      if (!voteIsOpen) {
        // Vote vient de s'ouvrir → (re)construire l'UI
        voteIsOpen = true;
        buildVoteUI(qIdx, opts);
      }
      show('vote');
      return;
    }

    // Cas 2 : vote fermé et on était en train de voter → "clos"
    if (!isOpen && voteIsOpen && !hasVoted) {
      voteIsOpen = false;
      doneSub.textContent = 'Le vote est clos pour cette question.';
      show('done');
      return;
    }

    // Cas 3 : vote fermé après qu'on ait voté → rester sur done
    if (!isOpen && hasVoted) {
      voteIsOpen = false;
      show('done');
      return;
    }

    // Cas 4 : vote pas encore ouvert → attendre
    if (!isOpen && !hasVoted) {
      voteIsOpen = false;
      show('wait');
      return;
    }
  });
}

function show(screen) {
  screenWait.classList.toggle('show', screen === 'wait');
  screenVote.classList.toggle('show', screen === 'vote');
  screenDone.classList.toggle('show', screen === 'done');
  if (screen === 'done' && !doneSub.textContent.includes('clos')) {
    doneSub.textContent = 'En attente de la prochaine question...';
  }
}

function buildVoteUI(qIdx, options) {
  qLabel.textContent       = `Question ${qIdx + 1}`;
  multiHint.style.display  = 'block';
  optList.innerHTML        = '';
  selected                 = new Set();

  options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span class="badge">${LETTERS[idx] || '?'}</span><span>${opt}</span>`;
    btn.addEventListener('click', () => {
      if (selected.has(idx)) {
        selected.delete(idx);
        btn.classList.remove('selected');
      } else {
        selected.add(idx);
        btn.classList.add('selected');
      }
      document.getElementById('valider-btn').disabled = selected.size === 0;
    });
    optList.appendChild(btn);
  });

  // Recréer le bouton Valider proprement (évite les doublons de listeners)
  const old = document.getElementById('valider-btn');
  const fresh = old.cloneNode(true);
  fresh.style.display = 'block';
  fresh.disabled = true;
  fresh.addEventListener('click', () => castVote(qIdx));
  old.replaceWith(fresh);
}

async function castVote(qIdx) {
  if (hasVoted) return;
  hasVoted = true;

  document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));
  document.getElementById('valider-btn').disabled = true;

  const key = voterName.toLowerCase().replace(/[^a-z0-9]/g, '_').slice(0, 20)
            + '_' + Math.random().toString(36).slice(2, 6);

  const value = selected.size === 1
    ? [...selected][0]
    : [...selected].sort((a, b) => a - b);

  await set(ref(db, `votes/q${qIdx}/${key}`), value);
  doneSub.textContent = 'En attente de la prochaine question...';
  show('done');
}
</script>
</body>
</html>
